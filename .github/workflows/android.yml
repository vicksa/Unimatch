name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UniMatch-0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniMatch-Android
          path: UniMatch-0.3.apk
          retention-days: 30
          if-no-files-found: error
